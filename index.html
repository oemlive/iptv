<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV 自动后台</title><link rel="stylesheet" href="./assets/style.css"></head><body><main><header><div><b>IPTV AUTO</b><h1>自动后台</h1><p>后台自动拉取、处理、发布；页面只负责查看。</p></div><span id="state" class="pill">加载中</span></header><section class="stats"><div><small>总数</small><strong id="total">—</strong></div><div><small>有效</small><strong id="valid">—</strong></div><div><small>异常</small><strong id="invalid">—</strong></div><div><small>最后更新</small><strong id="time">—</strong></div></section><section class="panel"><div class="head"><div><h2>运行状态</h2><p id="source">hw.json</p></div><button id="refresh">刷新</button></div><div id="steps"></div><pre id="log">等待后台数据…</pre></section><section class="panel"><div class="head"><div><h2>官方输入</h2><p>hw.json 只是入口清单：后台会继续拉取其中每个直播源，解析后最终只输出 TXT。</p></div><button id="copy">复制 TXT</button></div><textarea id="txt" readonly placeholder="后台任务完成后自动生成 TXT…"></textarea><div class="footline"><span id="txtCount">0 行</span><a id="download" download="iptv.txt">下载 TXT</a></div></section><footer>GitHub Actions 自动运行 · 无需 PAT</footer></main><script src="./assets/app.js"></script></body></html>
