<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB后台管理</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e6eaf0;--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--blue2:#eff6ff;--danger:#dc2626;--green:#059669}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand{font-size:19px;font-weight:700}.sub{font-size:12px;color:var(--muted)}.spacer{flex:1}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:16px;margin:0}.count{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{height:38px;border:1px solid #d7dde7;border-radius:8px;padding:0 10px;background:#fff;color:var(--text)}input.search{flex:1;min-width:220px}button{height:38px;border:1px solid #d7dde7;border-radius:8px;background:#fff;padding:0 13px;cursor:pointer;font-weight:600;color:var(--text)}button:hover{background:#f8fafc}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--danger)}button.green{background:var(--green);border-color:var(--green);color:#fff}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row:hover{background:#fafcff}.check{width:18px;height:18px}.name{font-weight:600}.url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:2px}.grow{flex:1;min-width:0}.tag{font-size:11px;color:#1d4ed8;background:var(--blue2);padding:3px 7px;border-radius:999px}.empty{padding:30px;text-align:center;color:var(--muted)}.status{margin-top:10px;color:var(--muted);font-size:12px;white-space:pre-wrap}.ok{color:var(--green)}.bad{color:var(--danger)}.form{display:grid;grid-template-columns:180px 1fr auto;gap:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:8px}}
</style></head><body><div class="wrap">
<header class="top"><div class="logo">TV</div><div><div class="brand">WEB后台管理</div><div class="sub">简单、静态、无 Worker；配置保存在当前浏览器</div></div><div class="spacer"></div><button id="reset">恢复内置配置</button></header>
<section class="card"><div class="head"><h2>订阅源管理</h2><span id="count" class="count"></span></div>
<div class="toolbar"><button class="primary" id="load">加载内置订阅</button><button id="all">全选</button><button id="none">全不选</button><button id="export">导出配置</button><button id="importBtn">导入配置</button><input id="file" type="file" accept="application/json" hidden><input id="search" class="search" placeholder="搜索名称 / 地址"></div>
<div id="list" class="list"></div><div id="status" class="status"></div></section>
<section class="card"><div class="head"><h2>自定义订阅</h2></div><div class="form"><input id="newName" placeholder="订阅名称"><input id="newUrl" placeholder="订阅地址（URL）"><button class="primary" id="add">添加</button></div><div class="status">新增内容只保存在本浏览器；点击“导出配置”即可得到可迁移的 JSON。</div></section>
<section class="card"><div class="head"><h2>已选订阅</h2><span id="selectedCount" class="count"></span></div><div id="selected" class="list"></div><div class="toolbar" style="margin-top:12px"><button class="green" id="pull">获取已选直播源（本机服务模式）</button><button id="clearChannels">清空直播源</button><button id="exportM3U">导出 M3U</button></div><div id="channelsStatus" class="status"></div><div id="channels" class="list" style="margin-top:10px"></div></section>
<footer class="status" style="text-align:center;padding:14px">WEB后台管理 · 内置入口：Gitee oemive/iptv · 浏览器静态模式不直接请求外部入口</footer>
</div><script src="./config.js"></script><script>
const KEY='web_admin_state_v1';
const CATALOG_URL=(window.WEB_ADMIN_CONFIG&&window.WEB_ADMIN_CONFIG.catalog)||'./data/hw.json';
const BUILTIN_URL='https://raw.giteeusercontent.com/oemive/iptv/raw/master/hw.json';
let catalog=[],state={subscriptions:[],selected_urls:[],channels:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.subscriptions)){state=Object.assign(state,x)}}catch{} }
async function loadCatalog(){
  try{const r=await fetch(CATALOG_URL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();catalog=Array.isArray(d.lives)?d.lives:[];return true}
  catch(e){catalog=[];$('status').textContent='无法读取内置目录：'+e.message;return false}
}
function normalize(){const map=new Map();for(const x of state.subscriptions||[]){if(x&&x.url&&!map.has(x.url))map.set(x.url,{name:x.name||x.url,url:x.url,enabled:x.enabled!==false})}state.subscriptions=[...map.values()]}
function render(){normalize();const q=$('search').value.trim().toLowerCase();const rows=state.subscriptions.filter(x=>(x.name+' '+x.url).toLowerCase().includes(q));$('count').textContent=`${state.subscriptions.length} 条`;$('selectedCount').textContent=`已选 ${state.selected_urls.length} 条`;
$('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><input class="check" type="checkbox" data-url="${esc(x.url)}" ${state.selected_urls.includes(x.url)?'checked':''}><div class="grow"><div class="name">${esc(x.name)}</div><div class="url">${esc(x.url)}</div></div>${x.builtin?'<span class="tag">内置</span>':''}<button class="danger del" data-url="${esc(x.url)}">删除</button></div>`).join(''):'<div class="empty">没有订阅。点击“加载内置订阅”。</div>';
$('selected').innerHTML=state.selected_urls.length?state.selected_urls.map(u=>{const x=state.subscriptions.find(s=>s.url===u)||{name:u,url:u};return `<div class="row"><div class="grow"><div class="name">${esc(x.name)}</div><div class="url">${esc(x.url)}</div></div></div>`}).join(''):'<div class="empty">尚未选择订阅。</div>';
$('channels').innerHTML=state.channels.length?state.channels.slice(0,500).map(x=>`<div class="row"><div class="grow"><div class="name">${esc(x.name)}</div><div class="url">${esc(x.url)}</div></div><span class="tag">${esc(x.group||'其他')}</span></div>`).join(''):'<div class="empty">暂无直播源。使用本机服务模式获取。</div>';
}
function setStatus(t,ok=false,bad=false){$('status').textContent=t;$('status').className='status '+(ok?'ok':bad?'bad':'')}
$('load').onclick=async()=>{if(!await loadCatalog())return;state.subscriptions=catalog.map(x=>({name:x.name||x.url,url:x.url,enabled:true,builtin:true}));state.selected_urls=state.subscriptions.map(x=>x.url);save();render();setStatus(`已加载 ${state.subscriptions.length} 条内置订阅。没有访问 Gitee，不会产生 CORS/401。`,true)};
$('all').onclick=()=>{state.selected_urls=state.subscriptions.map(x=>x.url);save();render()};$('none').onclick=()=>{state.selected_urls=[];save();render()};
$('list').onclick=e=>{const c=e.target.closest('.check');if(c){const u=c.dataset.url;if(c.checked&&!state.selected_urls.includes(u))state.selected_urls.push(u);if(!c.checked)state.selected_urls=state.selected_urls.filter(x=>x!==u);save();render();return}const d=e.target.closest('.del');if(d){const u=d.dataset.url;state.subscriptions=state.subscriptions.filter(x=>x.url!==u);state.selected_urls=state.selected_urls.filter(x=>x!==u);save();render()}};
$('search').oninput=render;
$('add').onclick=()=>{const name=$('newName').value.trim(),url=$('newUrl').value.trim();if(!name||!url){setStatus('请输入名称和 URL',false,true);return}state.subscriptions.push({name,url,enabled:true,builtin:false});$('newName').value='';$('newUrl').value='';save();render();setStatus('已添加自定义订阅。',true)};
$('reset').onclick=async()=>{localStorage.removeItem(KEY);state={subscriptions:[],selected_urls:[],channels:[]};await loadCatalog();state.subscriptions=catalog.map(x=>({name:x.name||x.url,url:x.url,enabled:true,builtin:true}));state.selected_urls=state.subscriptions.map(x=>x.url);save();render();setStatus('已恢复内置配置。',true)};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='web-admin-config.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());save();render();setStatus('配置导入成功。',true)}catch(x){setStatus('配置导入失败：'+x.message,false,true)}};
$('pull').onclick=async()=>{if(location.protocol==='file:'){setStatus('请通过 GitHub Pages 或本机 server.py 打开，不能直接双击 HTML。',false,true);return}try{$('channelsStatus').textContent='正在通过本机服务获取…';const r=await fetch('/api/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:state.selected_urls})});const d=await r.json();if(!r.ok)throw Error(d.detail||'HTTP '+r.status);state.channels=d.channels||[];save();render();$('channelsStatus').textContent=`完成：${state.channels.length} 条频道；失败 ${d.errors?.length||0} 条。`;if(d.errors?.length) $('channelsStatus').textContent+='\n'+d.errors.map(x=>x.name+'：'+x.error).join('\n')}catch(e){$('channelsStatus').textContent='当前是 GitHub Pages 静态模式。浏览器不能安全绕过外部订阅源的 CORS；如需实际抓取直播源，请在电脑运行 server.py。'}};
$('clearChannels').onclick=()=>{state.channels=[];save();render();$('channelsStatus').textContent='已清空。'};
$('exportM3U').onclick=()=>{const m=['#EXTM3U',...state.channels.flatMap(x=>[`#EXTINF:-1 group-title="${String(x.group||'其他').replace(/"/g,'')}",${x.name||'UNKNOWN'}`,x.url||''])].join('\n')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([m],{type:'text/plain;charset=utf-8'}));a.download='channels.m3u';a.click()};
(async()=>{loadState();if(!state.subscriptions.length){await loadCatalog();if(catalog.length){state.subscriptions=catalog.map(x=>({name:x.name||x.url,url:x.url,enabled:true,builtin:true}));state.selected_urls=state.subscriptions.map(x=>x.url);save()}}render()})();
</script></body></html>
