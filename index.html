<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB后台管理</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#e4e8ee;--text:#202938;--muted:#687386;--blue:#2563eb;--danger:#dc2626;--ok:#059669}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.top{padding:15px 18px;display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand{font-size:19px;font-weight:700}.sub,.status,.url,.count{color:var(--muted);font-size:12px}.spacer{flex:1}.card{margin-top:14px;padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input{height:38px;border:1px solid #d3d9e3;border-radius:8px;padding:0 10px;background:#fff;color:var(--text)}input.search{flex:1;min-width:220px}button{height:38px;border:1px solid #d3d9e3;border-radius:8px;background:#fff;padding:0 13px;cursor:pointer;font-weight:600}button:hover{background:#f8fafc}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--danger)}button.green{background:var(--ok);border-color:var(--ok);color:#fff}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.name{font-weight:600}.url{word-break:break-all;margin-top:2px}.tag{font-size:11px;background:#eff6ff;color:#1d4ed8;padding:3px 7px;border-radius:999px}.empty{padding:30px;text-align:center;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--danger)}.form{display:grid;grid-template-columns:180px 1fr auto;gap:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:8px}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">TV</div><div><div class="brand">WEB后台管理</div><div class="sub">纯静态模式 · 不依赖 Worker · 不依赖外部入口实时访问</div></div><div class="spacer"></div><button id="reset">恢复内置配置</button></header>
<section class="card"><div class="head"><h2>订阅源管理</h2><span id="count" class="count"></span></div><div class="toolbar"><button class="primary" id="load">加载内置订阅</button><button id="all">全选</button><button id="none">全不选</button><button id="export">导出配置</button><button id="importBtn">导入配置</button><input id="file" type="file" accept="application/json" hidden><input id="search" class="search" placeholder="搜索名称 / 地址"></div><div id="list" class="list"></div><div id="status" class="status"></div></section>
<section class="card"><div class="head"><h2>自定义订阅</h2></div><div class="form"><input id="newName" placeholder="订阅名称"><input id="newUrl" placeholder="订阅地址（URL）"><button class="primary" id="add">添加</button></div><div class="status">自定义内容只保存在当前浏览器。不会自动上传任何服务器。</div></section>
<section class="card"><div class="head"><h2>已选订阅</h2><span id="selectedCount" class="count"></span></div><div id="selected" class="list"></div><div class="toolbar" style="margin-top:12px"><button class="green" id="pull">本机获取直播源</button><button id="clearChannels">清空直播源</button><button id="exportM3U">导出 M3U</button></div><div id="channelsStatus" class="status"></div><div id="channels" class="list" style="margin-top:10px"></div></section>
<footer class="status" style="text-align:center;padding:14px">WEB后台管理 · 内置上游：Gitee oemive/iptv · 上游仅用于更新源码内置快照</footer></div><script src="./config.js"></script><script>
'use strict';const KEY='web_admin_state_v2';const C=(window.WEB_ADMIN_CONFIG&&window.WEB_ADMIN_CONFIG.builtinCatalog)||{lives:[]};let state={subscriptions:[],selected_urls:[],channels:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function normalize(){const m=new Map();for(const x of state.subscriptions||[]){if(x&&x.url&&!m.has(x.url))m.set(x.url,{name:x.name||x.url,url:x.url,builtin:!!x.builtin})}state.subscriptions=[...m.values()];const valid=new Set(state.subscriptions.map(x=>x.url));state.selected_urls=[...new Set((state.selected_urls||[]).filter(u=>valid.has(u)))]}
function loadSaved(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.subscriptions))state=x}catch{}}function builtin(){return (C.lives||[]).filter(x=>x&&x.url).map(x=>({name:x.name||x.url,url:x.url,builtin:true}))}
function render(){normalize();const q=$('search').value.trim().toLowerCase();const rows=state.subscriptions.filter(x=>(x.name+' '+x.url).toLowerCase().includes(q));$('count').textContent=state.subscriptions.length+' 条';$('selectedCount').textContent='已选 '+state.selected_urls.length+' 条';$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><input class="check" type="checkbox" data-url="'+esc(x.url)+'" '+(state.selected_urls.includes(x.url)?'checked':'')+'><div class="grow"><div class="name">'+esc(x.name)+'</div><div class="url">'+esc(x.url)+'</div></div>'+(x.builtin?'<span class="tag">内置</span>':'')+'<button class="danger del" data-url="'+esc(x.url)+'">删除</button></div>').join(''):'<div class="empty">没有订阅。</div>';$('selected').innerHTML=state.selected_urls.length?state.selected_urls.map(u=>{const x=state.subscriptions.find(s=>s.url===u)||{name:u,url:u};return '<div class="row"><div class="grow"><div class="name">'+esc(x.name)+'</div><div class="url">'+esc(x.url)+'</div></div></div>'}).join(''):'<div class="empty">尚未选择订阅。</div>';$('channels').innerHTML=state.channels.length?state.channels.slice(0,1000).map(x=>'<div class="row"><div class="grow"><div class="name">'+esc(x.name)+'</div><div class="url">'+esc(x.url)+'</div></div><span class="tag">'+esc(x.group||'其他')+'</span></div>').join(''):'<div class="empty">暂无直播源。</div>'}
function status(t,ok=false,bad=false){$('status').textContent=t;$('status').className='status '+(ok?'ok':bad?'bad':'')}function loadBuiltin(){state.subscriptions=builtin();state.selected_urls=state.subscriptions.map(x=>x.url);save();render();status('已加载 '+state.subscriptions.length+' 条内置订阅。此操作完全离线，不请求 Gitee。',true)}
$('load').onclick=loadBuiltin;$('all').onclick=()=>{state.selected_urls=state.subscriptions.map(x=>x.url);save();render()};$('none').onclick=()=>{state.selected_urls=[];save();render()};$('reset').onclick=()=>{localStorage.removeItem(KEY);state={subscriptions:[],selected_urls:[],channels:[]};loadBuiltin()};$('search').oninput=render;
$('list').onclick=e=>{const c=e.target.closest('.check');if(c){const u=c.dataset.url;if(c.checked&&!state.selected_urls.includes(u))state.selected_urls.push(u);if(!c.checked)state.selected_urls=state.selected_urls.filter(x=>x!==u);save();render();return}const d=e.target.closest('.del');if(d){const u=d.dataset.url;state.subscriptions=state.subscriptions.filter(x=>x.url!==u);state.selected_urls=state.selected_urls.filter(x=>x!==u);save();render()}};
$('add').onclick=()=>{const name=$('newName').value.trim(),url=$('newUrl').value.trim();if(!name||!url){status('请输入名称和 URL',false,true);return}if(state.subscriptions.some(x=>x.url===url)){status('该 URL 已存在',false,true);return}state.subscriptions.push({name,url,builtin:false});$('newName').value='';$('newUrl').value='';save();render();status('已添加自定义订阅。',true)};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='web-admin-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.subscriptions)||!Array.isArray(x.selected_urls))throw Error('配置格式不正确');state={subscriptions:x.subscriptions,selected_urls:x.selected_urls,channels:Array.isArray(x.channels)?x.channels:[]};normalize();save();render();status('配置导入成功。',true)}catch(x){status('配置导入失败：'+x.message,false,true)}e.target.value=''};
$('pull').onclick=async()=>{if(!state.selected_urls.length){$('channelsStatus').textContent='请先选择订阅源。';return}if(location.protocol==='file:'){$('channelsStatus').textContent='请通过 GitHub Pages 或 python server.py 打开页面。';return}try{$('channelsStatus').textContent='正在请求本机服务…';const r=await fetch('/api/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:state.selected_urls})});const d=await r.json();if(!r.ok)throw Error(d.detail||'HTTP '+r.status);state.channels=d.channels||[];save();render();$('channelsStatus').textContent='完成：'+state.channels.length+' 条频道；失败 '+(d.errors?.length||0)+' 条。'}catch(e){$('channelsStatus').textContent='静态 GitHub Pages 不执行外部订阅抓取。请运行源码内的 server.py 使用“本机获取直播源”。'}};
$('clearChannels').onclick=()=>{state.channels=[];save();render();$('channelsStatus').textContent='已清空。'};$('exportM3U').onclick=()=>{const m=['#EXTM3U',...state.channels.flatMap(x=>['#EXTINF:-1 group-title="'+String(x.group||'其他').replace(/"/g,'')+'",'+(x.name||'UNKNOWN'),x.url||''])].join('\n')+'\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([m],{type:'text/plain;charset=utf-8'}));a.download='channels.m3u';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
loadSaved();normalize();if(!state.subscriptions.length)loadBuiltin();else render();
</script></body></html>
