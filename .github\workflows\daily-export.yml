name: Source Hunter - Daily Export

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: source-hunter-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Pull, scan and export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, json
          for f in ["config/config.yaml", "config/rules.yaml", "config/subscriptions.yaml"]:
              yaml.safe_load(Path(f).read_text(encoding="utf-8"))
          json.loads(Path("config/selection.json").read_text(encoding="utf-8"))
          print("configuration OK")
          PY
      - name: Run source pipeline
        run: python cli.py --pull --scan --export
      - name: Show summary
        if: always()
        run: cat output/run-summary.json || true
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh IPTV sources"
            git push origin HEAD:main
          fi
