name: Deploy IPTV Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - 'output/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site/iptv
          cp -r web/* _site/iptv/
          cp -r data _site/iptv/ || true
          cp -r output _site/iptv/ || true
          touch _site/iptv/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
