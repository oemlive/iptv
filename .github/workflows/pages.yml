name: Deploy IPTV Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - 'output/**'
      - 'config/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          [ ! -d data ] || cp -r data _site/
          [ ! -d output ] || cp -r output _site/
          [ ! -d config ] || cp -r config _site/
          touch _site/.nojekyll
          test -f _site/index.html
          echo '--- artifact root ---'
          find _site -maxdepth 2 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "${PAGE_URL}"
          echo "Deployed URL: ${PAGE_URL}"
          for i in {1..12}; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "${PAGE_URL}" || true)
            echo "Attempt ${i}: HTTP ${code}"
            if [ "${code}" = "200" ] && grep -qi 'IPTV' /tmp/page.html; then
              echo 'GitHub Pages smoke test passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages smoke test failed.'
          exit 1
