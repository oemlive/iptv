name: Source Hunter - Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/**"
      - "cli.py"
      - "requirements.txt"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app cli.py
      - name: Validate config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, json
          for f in ["config/config.yaml", "config/rules.yaml", "config/subscriptions.yaml"]:
              yaml.safe_load(Path(f).read_text(encoding="utf-8"))
          json.loads(Path("config/selection.json").read_text(encoding="utf-8"))
          print("OK")
          PY
