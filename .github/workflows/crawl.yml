name: IPTV Crawl Validate Publish

on:
  workflow_dispatch:
    inputs:
      stability_seconds:
        description: 连续稳定性检测秒数，0关闭
        required: false
        default: '0'
        type: string
      concurrency:
        description: 验证并发，建议 8-20
        required: false
        default: '12'
        type: string
      force:
        description: 手动运行时忽略定时配置
        required: false
        default: true
        type: boolean
  schedule:
    # GitHub Actions scheduled workflows have a practical minimum interval of 5 minutes.
    # settings.json decides whether this tick is due.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: iptv-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          STABILITY_SECONDS: ${{ inputs.stability_seconds || '0' }}
          MAX_CONCURRENCY: ${{ inputs.concurrency || '12' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/run_crawler.py
      - name: Commit generated data and status
        if: always()
        run: |
          git config user.name 'IPTV Automation Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data output
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'auto: update IPTV crawler data' || true
            git push || true
          fi
