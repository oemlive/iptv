server:
  host: 127.0.0.1
  port: 8090
scanner:
  concurrency: 24
  timeout_seconds: 6
  subscription_timeout_seconds: 20
  user_agent: Source-Hunter-PRO/11.1
  ffprobe_enabled: true
health:
  keep_runs: 90
  reliability_window: 30
  suspend_after_consecutive_failures: 5
export:
  deduplicate_urls: true
  auto_select_new_channels: true
  mode: all
  category_files: true
github:
  enabled: true
  owner: your-name
  repo: your-repo
  branch: main
  output_dir: output
epg:
  enabled: false
  urls: []
  output: output/epg.xml
