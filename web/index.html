<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB后台管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18212b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 22px;position:sticky;top:0;z-index:10}main{max-width:1250px;margin:auto;padding:16px}.brand{font-size:22px;font-weight:700}.muted{color:#667085}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,textarea,select{border:1px solid #d0d5dd;border-radius:8px;padding:9px;font:inherit}input,select{height:40px}.grow{flex:1;min-width:180px}button{border:1px solid #cfd4dc;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}button.primary{background:#111827;color:#fff;border-color:#111827}.danger{color:#b42318}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#fafafa;border:1px solid #eaecf0;border-radius:10px;padding:12px}.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}.tab.active{background:#111827;color:#fff}.source{border-bottom:1px solid #eee;padding:10px 0}.source:last-child{border:0}.channel{padding:9px 2px;border-bottom:1px solid #eee}.pill{font-size:12px;background:#eef2f6;border-radius:999px;padding:2px 7px;margin-left:5px}.ok{color:#067647}.err{color:#b42318}.list{max-height:520px;overflow:auto}.mono{background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12px}.right{margin-left:auto}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="row"><div><div class="brand">WEB后台管理</div><div class="muted">订阅源 → 拉取 → 筛选 → 输出 → 自动更新</div></div><div class="right"><button onclick="runNow()" class="primary">立即更新</button><button onclick="loadAll()">刷新</button></div></div></header><main>
<div class="tabs"><button class="tab active" onclick="show('sources',this)">①订阅源</button><button class="tab" onclick="show('channels',this)">②频道筛选</button><button class="tab" onclick="show('rules',this)">③筛选规则</button><button class="tab" onclick="show('schedule',this)">④自动更新</button><button class="tab" onclick="show('output',this)">⑤输出</button></div>
<section id="sources"><div class="card"><h2>订阅源</h2><div class="row"><input id="sn" class="grow" placeholder="名称，例如 我的 IPTV"><input id="su" class="grow" placeholder="https://example.com/iptv.m3u"><button onclick="addSource()">添加并拉取</button></div><div id="sourcesList"></div></div><div class="card"><div class="grid"><div class="stat">订阅源<br><b id="stSources">0</b></div><div class="stat">原始频道<br><b id="stRaw">0</b></div><div class="stat">筛选后<br><b id="stSelected">0</b></div><div class="stat">最后更新<br><b id="stTime">-</b></div><div class="stat">状态<br><b id="stStatus">空闲</b></div></div><div id="log" class="mono" style="margin-top:10px"></div></div></section>
<section id="channels" style="display:none"><div class="card"><div class="row"><input id="q" class="grow" placeholder="搜索频道名称、分组、URL" oninput="renderChannels()"><select id="cq" onchange="renderChannels()"><option value="">全部分类</option></select><button onclick="setVisible(true)">选择当前结果</button><button onclick="setVisible(false)">取消当前结果</button></div><p class="muted">勾选会立即保存。自动更新时会优先保留匹配规则；手工选择用于当前输出。</p><div id="channelsList" class="list"></div></div></section>
<section id="rules" style="display:none"><div class="card"><h2>筛选规则</h2><p class="muted">每行一个关键词。包含规则为空表示不限制；排除规则优先级最高。分类关键词用于自动分类。</p><label>包含关键词</label><textarea id="include" rows="5" style="width:100%" placeholder="CCTV\n湖南卫视"></textarea><label>排除关键词</label><textarea id="exclude" rows="5" style="width:100%;margin-top:8px" placeholder="测试\n备用"></textarea><label>分类关键词 JSON</label><textarea id="catkw" rows="7" style="width:100%;margin-top:8px" placeholder='{"央视":["CCTV","央视"],"卫视":["卫视"],"体育":["体育","CSPN"],"电影":["电影"],"少儿":["少儿","卡通"]}'></textarea><button class="primary" onclick="saveRules()" style="margin-top:8px">保存规则并重新筛选</button></div></section>
<section id="schedule" style="display:none"><div class="card"><h2>自动更新</h2><div class="row"><label><input id="sched" type="checkbox"> 每天自动更新</label><input id="time" type="time" value="03:00"><button class="primary" onclick="saveSchedule()">保存计划</button></div><p class="muted">后台服务必须保持运行。到点后服务端拉取全部启用订阅，重新解析、分类、筛选并覆盖固定输出文件。</p></div></section>
<section id="output" style="display:none"><div class="card"><h2>输出</h2><div class="row"><label>文件名 <input id="ofn" value="webtv.m3u"></label><label>输出地址前缀 <input id="base" class="grow" placeholder="http://你的服务器:8787"></label><button class="primary" onclick="saveOutput()">保存输出设置</button></div><p>固定输出地址：<a id="outlink" target="_blank">/output/webtv.m3u</a></p><p>播放器可直接填写：<code id="outurl"></code></p><div class="row"><button onclick="downloadOutput()">下载 M3U</button><button onclick="runNow()" class="primary">立即重新生成</button></div></div></section>
</main><script>
let cfg={},data={channels:[]};const $=id=>document.getElementById(id);async function api(p,opt){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...opt});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||x.message||('HTTP '+r.status));return x}
async function loadAll(){try{[cfg,data]=await Promise.all([(api('/api/config')),(api('/api/channels'))]);cfg=cfg.config||cfg;data=data||{channels:[]};fill();renderSources();renderChannels();status();}catch(e){alert(e.message)}}
function fill(){let r=cfg.rules||{};$('include').value=(r.include_keywords||[]).join('\n');$('exclude').value=(r.exclude_keywords||[]).join('\n');$('catkw').value=JSON.stringify(r.category_keywords||{},null,2);$('sched').checked=!!cfg.schedule?.enabled;$('time').value=cfg.schedule?.time||'03:00';$('ofn').value=cfg.output?.filename||'webtv.m3u';$('base').value=cfg.output?.base_url||'';let cats=[...new Set(data.channels.map(x=>x.category||'其他'))].sort();$('cq').innerHTML='<option value="">全部分类</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');}
function renderSources(){let a=cfg.subscriptions||[];$('sourcesList').innerHTML=a.map((s,i)=>`<div class=source><div class=row><input type=checkbox ${s.enabled!==false?'checked':''} onchange="toggleSource(${i},this.checked)"><b>${esc(s.name||s.url)}</b><span class=pill>${esc(s.last_count??'-')} 条</span><span class="${s.last_error?'err':'ok'}">${esc(s.last_error?'失败':'可用')}</span><button class=right onclick="pullOne(${i})">立即拉取</button><button onclick="delSource(${i})">删除</button></div><div class=muted style="word-break:break-all">${esc(s.url)}</div></div>`).join('')||'<p class=muted>还没有订阅源。</p>';}
function renderChannels(){let q=($('q').value||'').toLowerCase(),c=$('cq').value,arr=(data.channels||[]).filter(x=>(!q||`${x.name} ${x.group} ${x.url} ${x.category}`.toLowerCase().includes(q))&&(!c||x.category===c));$('channelsList').innerHTML=arr.map(x=>`<div class=channel><label><input type=checkbox ${x.selected?'checked':''} onchange="pick('${escAttr(x.id)}',this.checked)"> <b>${esc(x.name)}</b> <span class=pill>${esc(x.category||'其他')}</span> <span class=pill>${esc(x.group||'')}</span></label><div class=muted style="word-break:break-all">${esc(x.url)}</div></div>`).join('')||'<p class=muted>没有匹配频道。</p>';}
function pick(id,on){api('/api/channels/select',{method:'POST',body:JSON.stringify({id,selected:on})}).then(loadAll).catch(e=>alert(e.message))}function setVisible(on){let q=($('q').value||'').toLowerCase(),c=$('cq').value;let ids=(data.channels||[]).filter(x=>(!q||`${x.name} ${x.group} ${x.url} ${x.category}`.toLowerCase().includes(q))&&(!c||x.category===c)).map(x=>x.id);api('/api/channels/batch',{method:'POST',body:JSON.stringify({ids,selected:on})}).then(loadAll).catch(e=>alert(e.message))}
async function addSource(){let n=$('sn').value.trim(),u=$('su').value.trim();if(!u)return alert('请输入订阅地址');try{await api('/api/subscriptions',{method:'POST',body:JSON.stringify({name:n||u,url:u})});$('sn').value='';$('su').value='';await runNow()}catch(e){alert(e.message)}}async function delSource(i){if(!confirm('删除该订阅源？'))return;await api('/api/subscriptions/'+i,{method:'DELETE'});loadAll()}async function toggleSource(i,on){await api('/api/subscriptions/'+i,{method:'PATCH',body:JSON.stringify({enabled:on})});loadAll()}async function pullOne(i){try{let x=await api('/api/run',{method:'POST',body:JSON.stringify({only:i})});showLog(x);await loadAll()}catch(e){alert(e.message)}}
async function runNow(){try{$('stStatus').textContent='更新中…';let x=await api('/api/run',{method:'POST'});showLog(x);await loadAll();show('sources',document.querySelector('.tab.active'))}catch(e){$('stStatus').textContent='失败';$('log').textContent=e.message;alert(e.message)}}function showLog(x){$('log').textContent=JSON.stringify(x,null,2)}
async function saveRules(){try{let cat=JSON.parse($('catkw').value||'{}');await api('/api/rules',{method:'POST',body:JSON.stringify({include_keywords:lines($('include').value),exclude_keywords:lines($('exclude').value),category_keywords:cat})});await loadAll();alert('规则已保存并应用到当前频道。')}catch(e){alert(e.message)}}async function saveSchedule(){await api('/api/schedule',{method:'POST',body:JSON.stringify({enabled:$('sched').checked,time:$('time').value})});alert('自动更新计划已保存')}async function saveOutput(){await api('/api/output',{method:'POST',body:JSON.stringify({filename:$('ofn').value,base_url:$('base').value})});await loadAll()}async function downloadOutput(){location.href='/output/'+encodeURIComponent(cfg.output.filename||'webtv.m3u')}async function status(){let x=await api('/api/status');let r=x.status||{};$('stSources').textContent=(cfg.subscriptions||[]).length;$('stRaw').textContent=(data.channels||[]).length;$('stSelected').textContent=(data.channels||[]).filter(x=>x.selected).length;$('stTime').textContent=r.last_run?new Date(r.last_run).toLocaleString():'-';$('stStatus').textContent=r.running?'更新中':(r.last_error?'失败':'空闲');if(r.last_result)showLog(r.last_result);let f=cfg.output?.filename||'webtv.m3u';$('outlink').href='/output/'+encodeURIComponent(f);$('outlink').textContent='/output/'+f;$('outurl').textContent=(cfg.output?.base_url||location.origin)+'/output/'+encodeURIComponent(f)}function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.style.display='none');$(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')};function lines(s){return s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')};loadAll();setInterval(status,10000)
</script></body></html>
