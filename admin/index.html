<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source Hunter PRO</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f4f6f8}body{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:16px;margin:12px 0}h1,h2{margin:4px 0 12px}.muted{color:#667085}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,textarea,select{box-sizing:border-box;border:1px solid #cbd1d8;border-radius:8px;padding:9px}input[type=text],input[type=password],textarea{width:100%}.grow{flex:1;min-width:180px}button{padding:9px 13px;border:1px solid #b8bec7;border-radius:8px;background:#fff;cursor:pointer}button.primary{background:#111;color:#fff}.item{display:block;padding:9px 3px;border-bottom:1px solid #eee}.url{font-size:12px;color:#667085;word-break:break-all}.pill{display:inline-block;background:#eef0f2;border-radius:20px;padding:2px 7px;font-size:12px;margin-left:4px}.ok{color:#087f23}.bad{color:#b42318}.sticky{position:sticky;top:0;z-index:5;background:#f4f6f8;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:12px;border:1px solid #ddd;border-radius:9px;background:#fafafa}.cat{margin-top:14px}.mono{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#111;color:#eee;padding:10px;border-radius:8px;max-height:240px;overflow:auto}.small{font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="sticky"><div class="card"><h1>Source Hunter PRO 11.1</h1><div class="muted">GitHub Pages 管理端。拉取、解析、分类、6秒检测、健康评分、导出全部由 GitHub Actions 执行。</div><div class="row"><div class="grow"><input id="repo" placeholder="GitHub 用户名/仓库，例如 abc/IPTV"></div><div class="grow"><input id="token" type="password" placeholder="Fine-grained PAT：仅目标仓库 Contents/Actions 权限"></div><button class="primary" onclick="connect()">连接</button><button onclick="clearCred()">清除</button><span id="conn" class="muted"></span></div></div></div>
<div class="card"><h2>运行状态</h2><div class="grid"><div class="stat">订阅<br><b id="s1">-</b></div><div class="stat">节目<br><b id="s2">-</b></div><div class="stat">存活<br><b id="s3">-</b></div><div class="stat">失败<br><b id="s4">-</b></div><div class="stat">最近运行<br><b id="s5">-</b></div></div><div class="row" style="margin-top:8px"><button class="primary" onclick="dispatch()">立即运行 Actions</button><button onclick="refreshAll()">刷新</button><a id="actions" target="_blank">Actions</a></div></div>
<div class="card"><h2>① 订阅源</h2><div class="row"><input id="subname" class="grow" placeholder="名称"><input id="suburl" class="grow" placeholder="支持 M3U/TXT/JSON/XML 等 URL"><button onclick="addSub()">添加</button></div><div id="subs"></div><div class="row"><button onclick="selectAllSubs(true)">全选</button><button onclick="selectAllSubs(false)">全不选</button><button class="primary" onclick="saveAll()">保存配置</button></div></div>
<div class="card"><h2>② 频道选择</h2><div class="row"><input id="search" class="grow" placeholder="搜索频道、URL、分类" oninput="renderChannels()"><select id="cat" onchange="renderChannels()"><option value="">全部分类</option><option>央视</option><option>卫视</option><option>港台</option><option>其他</option><option>网页</option></select></div><div class="row"><button onclick="allChannels(true)">全部选择</button><button onclick="allChannels(false)">全部取消</button><button onclick="aliveOnly()">只选存活</button><button onclick="bestOnly()">每台只留最佳线路</button><button onclick="saveSelection()">保存选择</button></div><div id="channels"></div></div>
<div class="card"><h2>③ 分类 / 黑白名单</h2><p class="muted small">规则保存在 config/rules.yaml；网页可以先编辑关键词、黑名单、白名单，下一次 Actions 生效。</p><textarea id="rules" rows="12" placeholder="rules:\n  - keyword: CCTV\n    category: 央视\n    priority: 100\nblacklist: []\nwhitelist: []\nstrict_whitelist: false"></textarea><button onclick="saveRules()">保存规则</button></div>
<div class="card"><h2>④ 输出</h2><p><a id="m3u" target="_blank">all.m3u</a> · <a id="best" target="_blank">best.m3u</a> · <a id="backup" target="_blank">backup.m3u</a> · <a id="json" target="_blank">channels.json</a></p><div id="log" class="mono"></div></div>
<script>
let owner='',repo='',token='',sha={},subs=[],selection={version:4,selected_subscriptions:[],selected_subscription_urls:[],selected_channels:{},excluded_channels:{},default_selected:true},channels=[];const cats=['央视','卫视','港台','其他','网页'];
function api(path,opt={}){return fetch(`https://api.github.com/repos/${owner}/${repo}/${path}`,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}).then(async r=>{let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||r.status);return x})}
function parseRepo(){let a=document.getElementById('repo').value.trim().split('/');if(a.length!==2)throw Error('仓库格式必须是 用户名/仓库');[owner,repo]=a}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}function enc(s){return btoa(unescape(encodeURIComponent(s)))}
async function read(path){let x=await api(`contents/${path}`);sha[path]=x.sha;return dec(x.content)}async function put(path,text,msg){let b={message:msg,content:enc(text),branch:'main'};if(sha[path])b.sha=sha[path];let x=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify(b)});sha[path]=x.content?.sha||x.commit?.sha;return x}
function parseYaml(s){let a=[],cur=null;for(let l of s.split(/\r?\n/)){let m=l.match(/^\s*- name:\s*(.*)$/);if(m){cur={name:m[1],url:'',enabled:true};a.push(cur)}m=l.match(/^\s*url:\s*(.*)$/);if(m&&cur)cur.url=m[1];m=l.match(/^\s*enabled:\s*(true|false)/);if(m&&cur)cur.enabled=m[1]==='true'}return a}
async function connect(){try{parseRepo();token=document.getElementById('token').value.trim();if(!token)throw Error('请输入 Token');let y=await read('config/subscriptions.yaml');subs=parseYaml(y);selection=JSON.parse(await read('config/selection.json'));try{document.getElementById('rules').value=await read('config/rules.yaml')}catch{};document.getElementById('conn').textContent='已连接';setLinks();await refreshAll()}catch(e){document.getElementById('conn').textContent='连接失败：'+e.message}}
function yaml(){return 'subscriptions:\n'+subs.map(s=>`  - name: ${String(s.name).replace(/[\r\n]/g,' ')}\n    url: ${s.url}\n    enabled: ${s.enabled!==false}`).join('\n')+'\n'}
function renderSubs(){subs.forEach(s=>s.enabled=selection.selected_subscription_urls?.includes(s.url));document.getElementById('subs').innerHTML=subs.map((s,i)=>`<label class=item><input type=checkbox ${s.enabled?'checked':''} onchange="subs[${i}].enabled=this.checked;toggleSub('${esc(s.url)}',this.checked)"> <b>${esc(s.name)}</b><br><span class=url>${esc(s.url)}</span></label>`).join('')||'<span class=muted>暂无订阅</span>'}
function toggleSub(u,on){let x=new Set(selection.selected_subscription_urls||[]);on?x.add(u):x.delete(u);selection.selected_subscription_urls=[...x]};function selectAllSubs(on){subs.forEach(s=>s.enabled=on);selection.selected_subscription_urls=on?subs.map(s=>s.url):[];renderSubs()}
function addSub(){let n=subname.value.trim(),u=suburl.value.trim();if(!n||!u)return alert('名称和 URL 必填');if(!/^https?:\/\//i.test(u))return alert('订阅必须是 HTTP/HTTPS URL');subs.push({name:n,url:u,enabled:true});selection.selected_subscription_urls??=[];selection.selected_subscription_urls.push(u);subname.value='';suburl.value='';renderSubs()}
async function loadChannels(){try{channels=(JSON.parse(await read('output/channels.json')).channels)||[]}catch{channels=[]}renderChannels()}
function renderChannels(){let q=search.value.toLowerCase(),c=cat.value,g={};for(let r of channels){let h=`${r.name} ${r.url} ${r.category}`.toLowerCase();if(q&&!h.includes(q)||c&&r.category!==c)continue;(g[r.category]??=[]).push(r)}document.getElementById('channels').innerHTML=cats.map(k=>g[k]?.length?`<div class=cat><h3>${k} (${g[k].length})</h3>${g[k].map(r=>{let key=r.channel_key||r.url,on=selection.selected_channels?.[key]!==false&&!selection.excluded_channels?.[key];return `<label class=item><input type=checkbox ${on?'checked':''} onchange="setCh('${esc(key)}',this.checked)"> <b>${esc(r.name)}</b><span class=pill>${esc(r.status||'unknown')}</span><span class=pill>${esc(String(r.score??''))}</span><span class=pill>${esc(String(r.stability_pct??''))}%</span><br><span class=url>${esc(r.url)}</span></label>`}).join('')}</div>`:'').join('')||'<span class=muted>Actions 尚未生成频道数据</span>'}
function setCh(k,on){selection.selected_channels??={};selection.excluded_channels??={};selection.selected_channels[k]=on;delete selection.excluded_channels[k];saveSelection(false)}function allChannels(on){selection.default_selected=on;selection.selected_channels={};for(let r of channels)selection.selected_channels[r.channel_key||r.url]=on;renderChannels()}function aliveOnly(){selection.default_selected=false;selection.selected_channels={};for(let r of channels)if(r.status==='alive')selection.selected_channels[r.channel_key||r.url]=true;renderChannels()}function bestOnly(){let seen=new Set();selection.default_selected=false;selection.selected_channels={};for(let r of [...channels].sort((a,b)=>(b.score||0)-(a.score||0))){let k=r.channel_key||r.url;if(!seen.has(k)&&r.status==='alive'){seen.add(k);selection.selected_channels[k]=true}}renderChannels()}
async function saveSelection(log=true){selection.version=4;selection.updated_at=new Date().toISOString();await put('config/selection.json',JSON.stringify(selection,null,2),'web: update channel selection');if(log)msg('频道选择已保存到 GitHub。')}
async function saveAll(){try{selection.selected_subscription_urls=[...new Set(selection.selected_subscription_urls||[])];await put('config/subscriptions.yaml',yaml(),'web: update subscriptions');await saveSelection(false);msg('订阅和频道选择已保存。点击“立即运行 Actions”开始处理。')}catch(e){msg('保存失败：'+e.message)}}
async function saveRules(){try{await put('config/rules.yaml',rules.value,'web: update classification rules');msg('分类规则已保存。下次 Actions 生效。')}catch(e){msg('规则保存失败：'+e.message)}}
async function dispatch(){try{await api('actions/workflows/daily-export.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main'})});msg('Actions 已触发。检测和导出在 GitHub Runner 上执行。')}catch(e){msg('触发失败：'+e.message)}}
async function refreshAll(){try{renderSubs();await loadChannels();let runs=await api('actions/runs?per_page=5');let r=runs.workflow_runs?.[0];s5.textContent=r?`${r.status}/${r.conclusion||'运行中'}`:'-';actions.href=`https://github.com/${owner}/${repo}/actions`;if(channels.length){s2.textContent=channels.length;s3.textContent=channels.filter(x=>x.status==='alive').length;s4.textContent=channels.filter(x=>x.status!=='alive').length}else{s2.textContent='-';s3.textContent='-';s4.textContent='-'}s1.textContent=subs.length}catch(e){msg('刷新：'+e.message)}}
function setLinks(){let b=`https://raw.githubusercontent.com/${owner}/${repo}/main/output/`;m3u.href=b+'channels.m3u';best.href=b+'best.m3u';backup.href=b+'backup.m3u';json.href=b+'channels.json'}function clearCred(){token='';document.getElementById('token').value='';document.getElementById('conn').textContent=''}function msg(x){log.textContent=x}function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
</script></body></html>
