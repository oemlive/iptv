<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB后台管理</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--panel2:#162238;--line:#26344d;--text:#e8eef8;--muted:#8fa1bb;--blue:#2f81f7;--blue2:#1d4ed8;--green:#20c997;--red:#ff5c70;--shadow:0 10px 30px rgba(0,0,0,.22);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#14233d 0,#0b1220 42%,#080e18 100%)}body{max-width:1280px;margin:auto;padding:18px}.hidden{display:none!important}.panel{background:linear-gradient(180deg,rgba(22,34,56,.98),rgba(15,25,42,.98));border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;margin:12px 0}.topbar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);padding-bottom:6px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#6ea8ff);display:grid;place-items:center;font-weight:800;color:#fff}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}h2{font-size:16px;margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}input,select{width:auto;min-height:38px;background:#0b1424;color:var(--text);border:1px solid #31415d;border-radius:7px;padding:8px 10px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,129,247,.16)}button{min-height:38px;padding:8px 13px;border:1px solid #34455f;border-radius:7px;background:#162238;color:var(--text);cursor:pointer;font-weight:600}button:hover{border-color:#5273a6;background:#1b2b46}button.primary{background:linear-gradient(180deg,#3488ff,#2169d5);border-color:#3f91ff;color:#fff}button.success{background:linear-gradient(180deg,#1dbb8b,#11966f);border-color:#25c99b;color:#fff}button:disabled{opacity:.45;cursor:wait}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}.search{flex:1;min-width:220px}.tabs{display:flex;gap:5px;overflow:auto;padding:4px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--muted);cursor:pointer}.tab.active{background:rgba(47,129,247,.18);border-color:#3f91ff;color:#dceaff}.list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0d1727}.item{display:block;padding:11px 12px;border-bottom:1px solid rgba(38,52,77,.8);cursor:pointer}.item:last-child{border-bottom:0}.item:hover{background:#132139}.itemline{display:flex;align-items:center;gap:9px}.item b{font-size:14px}.item input{min-height:auto;width:17px;height:17px;accent-color:var(--blue)}.url{font-size:11px;color:#7890b0;word-break:break-all;margin-left:26px;margin-top:4px}.pill{display:inline-block;border:1px solid #30415d;background:#132139;border-radius:20px;padding:2px 7px;font-size:11px;color:#a9bdd8;margin-left:4px}.count{margin-left:auto;color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hint{color:var(--muted);font-size:12px;margin:0 0 12px}.status{min-height:20px;color:var(--muted);font-size:12px;margin-top:9px}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.lock{max-width:430px;margin:16vh auto;text-align:center}.lock .brand{justify-content:center;margin-bottom:12px}.lock input{width:100%}.empty{padding:28px;text-align:center;color:var(--muted)}.group{margin-top:12px}.group-title{padding:9px 12px;background:#111f35;border-bottom:1px solid var(--line);font-size:13px;color:#bcd0ea}.outputbar{display:grid;grid-template-columns:1fr 150px 150px auto;gap:8px}.footer{color:#647894;text-align:center;font-size:11px;padding:14px}@media(max-width:760px){body{padding:8px}.panel{padding:11px}.outputbar{grid-template-columns:1fr 1fr}.outputbar .wide{grid-column:1/-1}.brand h1{font-size:18px}.toolbar button{flex:0 0 auto}}
</style></head><body>
<div id="login" class="panel lock">
  <div class="brand"><div class="brandmark">WEB</div><div><h1>WEB后台管理</h1><p>IPTV 订阅管理 · Worker 可选</p></div></div>
  <div class="row"><input id="password" type="password" class="grow" placeholder="请输入管理密码" autocomplete="current-password"><button class="primary" id="loginBtn">进入后台</button></div>
  <div id="loginMsg" class="status"></div>
</div>
<div id="app" class="hidden">
  <div class="topbar">
    <div class="panel" style="margin-top:0">
      <div class="row">
        <div class="brand grow"><div class="brandmark">WEB</div><div><h1>WEB后台管理</h1><p>订阅 → 全部直播源 → 人工选择 → M3U / TXT</p></div></div>
        <button id="logoutBtn">退出</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="section-head"><h2>订阅地址</h2><span id="subCount" class="count"></span></div>
    <p class="hint">先从入口订阅表中发现全部二级订阅地址。这里不做 6 秒检测，也不会删除线路。</p>
    <div class="toolbar">
      <button class="primary" id="discoverBtn">获取全部订阅</button><button id="subAll">全选</button><button id="subNone">全不选</button><button class="success" id="subSave">保存订阅选择</button>
      <input id="subSearch" class="search" placeholder="搜索订阅名称 / URL">
    </div>
    <div id="subs" class="list"></div><div id="subStatus" class="status"></div>
  </div>

  <div class="panel">
    <div class="section-head"><h2>直播源</h2><span id="chCount" class="count"></span></div>
    <p class="hint">只拉取已选择的订阅，并保留解析出的全部直播源。检测失败不会自动删除。</p>
    <div class="toolbar"><button class="primary" id="pullBtn">获取全部直播源</button><button id="chAll">全部选择</button><button id="chNone">全部取消</button><button class="success" id="chSave">保存频道选择</button><input id="chSearch" class="search" placeholder="搜索频道 / 分组 / URL"></div>
    <div id="tabs" class="tabs"></div><div id="channels" class="list"></div><div id="chStatus" class="status"></div>
  </div>

  <div class="panel">
    <div class="section-head"><h2>自定义输出</h2></div>
    <div class="outputbar">
      <input id="outName" class="wide" value="channels" placeholder="文件名">
      <select id="outFormat"><option value="m3u">M3U</option><option value="txt">TXT</option></select>
      <select id="outGroup"><option value="all">全部</option><option value="央视">央视</option><option value="卫视">卫视</option><option value="港台">港台</option><option value="其他">其他</option><option value="网页">网页</option></select>
      <button class="primary" id="makeBtn">生成文件</button>
    </div>
    <div id="output" class="status">尚未生成输出。</div>
  </div>
  <div class="footer">WEB后台管理 · Worker 可选 · 无 Worker 时使用 Pages 静态模式</div>
</div>
<script src="./config.js"></script><script>
const API_BASE=String(window.SOURCE_HUNTER_API||'').replace(/\/$/,'');
const BUILTIN_ROOT_CATALOG='https://raw.giteeusercontent.com/oemive/iptv/raw/master/hw.json';
const ROOT_CATALOG=String(window.SOURCE_HUNTER_ROOT_CATALOG||BUILTIN_ROOT_CATALOG).trim();
const ROOT_CATALOG_FALLBACKS=Array.isArray(window.SOURCE_HUNTER_ROOT_CATALOG_FALLBACKS)?window.SOURCE_HUNTER_ROOT_CATALOG_FALLBACKS:[];
const SAME_ORIGIN_CATALOG='./hw.json';
const CATS=['全部','央视','卫视','港台','其他','网页'];
const SESSION_KEY='sh_auth_v2',SELECTION_KEY='sh_selection_v2',LOCAL_DAYS=7;
const DEFAULT_SEL={version:4,selected_subscriptions:[],selected_subscription_urls:[],selected_channels:{},excluded_channels:{},default_selected:true,updated_at:null};
let subs=[],channels=[],selection=loadSelection(),remote=!!API_BASE,currentCat='全部',localPullErrors=[];
const $=id=>document.getElementById(id);
if(!remote){$('password').style.display='none';$('loginBtn').textContent='进入静态后台';$('loginMsg').textContent='无 Worker 静态模式：无需密码，直接进入后台。';}

function loadSelection(){try{return Object.assign({},DEFAULT_SEL,JSON.parse(localStorage.getItem(SELECTION_KEY)||'{}'))}catch{return {...DEFAULT_SEL}}}
function saveLocal(){selection.version=4;selection.updated_at=new Date().toISOString();localStorage.setItem(SELECTION_KEY,JSON.stringify(selection))}
function setLocalAuth(){localStorage.setItem(SESSION_KEY,JSON.stringify({exp:Date.now()+LOCAL_DAYS*86400000}))}
function hasLocalAuth(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'{}').exp>Date.now()}catch{return false}}
function clearLocalAuth(){localStorage.removeItem(SESSION_KEY)}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function api(path,opt={}){const r=await fetch(API_BASE+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||('HTTP '+r.status));return x}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');renderTabs(); if(remote)loadRemoteState().catch(()=>{}); else status('subStatus','本地静态模式：无需密码、无需 Worker，直接使用 Pages 同源 hw.json；连接 Worker 后可启用 GitHub 管理功能。',''); }
async function tryRemoteSession(){if(!remote)return false;try{await api('/api/session');showApp();return true}catch{return false}}
async function login(){const p=$('password').value.trim();$('loginBtn').disabled=true;$('loginMsg').textContent='正在进入…';try{if(remote){if(!p)throw Error('请输入管理密码');await api('/api/login',{method:'POST',body:JSON.stringify({password:p})});setLocalAuth();showApp()}else{clearLocalAuth();showApp()}}catch(e){$('loginMsg').textContent=e.message||'登录失败'}finally{$('loginBtn').disabled=false}}
async function logout(){clearLocalAuth();if(remote)await fetch(API_BASE+'/api/logout',{method:'POST',credentials:'include'}).catch(()=>{});$('password').value='';$('loginMsg').textContent='已退出，请重新进入后台。';$('app').classList.add('hidden');$('login').classList.remove('hidden');if(remote){$('password').style.display='block';$('loginBtn').textContent='进入后台';$('loginMsg').textContent='请输入管理密码'}else{ $('password').style.display='none';$('loginBtn').textContent='进入静态后台';$('loginMsg').textContent='无 Worker 静态模式：无需密码，直接进入后台。'} }
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=logout;
function status(id,text,cls=''){const e=$(id);e.textContent=text;e.className='status '+cls}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(u,base){u=String(u||'').trim().replace(/^['"]|['"]$/g,'');if(!u)return '';if(/^(https?|rtmp|rtsp|udp|p2p|webview):\/\//i.test(u))return u;try{return new URL(u,base).href}catch{return u}}
function dedupe(a,key){const m=new Map();for(const x of a){const k=key(x);if(x.url&&!m.has(k))m.set(k,x)}return [...m.values()]}
function catalogFromJson(text,base){const o=JSON.parse(text),a=[];for(const x of (o?.lives||[])){if(!x||typeof x!=='object')continue;const u=norm(x.url,base);if(u)a.push({name:String(x.name||u),url:u,headers:x.headers||{},enabled:true,group:String(x.group||'')})}return dedupe(a,x=>x.url)}
async function getDirect(url,allowProxy=window.SOURCE_HUNTER_ENABLE_PUBLIC_FETCH_FALLBACK!==false){
  const direct=async u=>{const r=await fetch(u,{cache:'no-store',redirect:'follow'});const text=await r.text();return {text,type:r.headers.get('content-type')||'',url:r.url,status:r.status}};
  const candidates=[];
  const add=u=>{if(!u)return;try{const abs=new URL(u,location.href).href;if(!candidates.includes(abs))candidates.push(abs)}catch{}};
  // Always prefer the same-origin static cache. The Gitee URL remains the authoritative upstream,
  // but the browser must not depend on it being CORS-accessible.
  add(SAME_ORIGIN_CATALOG);
  add('./hw.json');
  add(url||BUILTIN_ROOT_CATALOG);
  add(ROOT_CATALOG);
  for(const u of ROOT_CATALOG_FALLBACKS)add(u);
  let last=null;
  for(const u of candidates){
    try{
      const r=await direct(u);
      if(r.status>=200&&r.status<300)return r;
      last=Error('HTTP '+r.status+' @ '+u);
    }catch(e){last=e}
  }
  if(last)throw Error('入口获取失败：'+(last.message||last));
  throw Error('未配置入口订阅地址（内置入口已丢失，请刷新 GitHub Pages 部署）');
}
async function discover(){const b=$('discoverBtn');b.disabled=true;status('subStatus',remote?'正在通过管理服务获取全部订阅地址…':'正在获取入口订阅目录（多地址自动容错）…','');try{let data;if(remote){data=await api('/api/discover')}else{const r=await getDirect(SAME_ORIGIN_CATALOG,true);const o=JSON.parse(r.text.replace(/^\uFEFF/,''));const lives=Array.isArray(o.lives)?o.lives:[];const m=new Map();for(const x of lives){if(!x||typeof x!=='object'||!x.url)continue;let u=String(x.url).trim();try{u=new URL(u,r.url).href}catch{}if(!u)continue;const row={name:String(x.name||u),url:u,headers:x.headers||{},enabled:true,group:String(x.group||''),type:x.type??0,playerType:x.playerType??null,ua:x.ua||'',epg:x.epg||'',logo:x.logo||''};if(!m.has(u))m.set(u,row)}data={sources:[...m.values()]}}subs=Array.isArray(data.sources)?data.sources:[];renderSubs();updateSubCount();status('subStatus','已获取 '+subs.length+' 个订阅地址。'+(remote?'':'（本地模式）'),'ok')}catch(e){status('subStatus','获取失败：'+(e.message||e),'bad')}finally{b.disabled=false}}
$('discoverBtn').onclick=discover;$('subSearch').oninput=renderSubs;
function renderSubs(){const q=$('subSearch').value.toLowerCase(),chosen=new Set(selection.selected_subscription_urls||[]),rows=subs.filter(s=>`${s.name} ${s.url}`.toLowerCase().includes(q));$('subs').innerHTML=rows.map(s=>`<label class="item"><div class="itemline"><input type="checkbox" data-url="${esc(s.url)}" ${chosen.has(s.url)?'checked':''}><b>${esc(s.name)}</b>${s.group?`<span class="pill">${esc(s.group)}</span>`:''}</div><div class="url">${esc(s.url)}</div></label>`).join('')||'<div class="empty">暂无订阅地址</div>';document.querySelectorAll('#subs input').forEach(e=>e.onchange=()=>toggleSub(e.dataset.url,e.checked));}
function toggleSub(u,on){const s=new Set(selection.selected_subscription_urls||[]);on?s.add(u):s.delete(u);selection.selected_subscription_urls=[...s];saveLocal();updateSubCount()}
function updateSubCount(){const n=(selection.selected_subscription_urls||[]).length;$('subCount').textContent='已选 '+n+' / '+subs.length}
$('subAll').onclick=()=>{selection.selected_subscription_urls=subs.map(x=>x.url);saveLocal();renderSubs();updateSubCount()};$('subNone').onclick=()=>{selection.selected_subscription_urls=[];saveLocal();renderSubs();updateSubCount()};$('subSave').onclick=async()=>{saveLocal();if(remote)try{await api('/api/selection',{method:'POST',body:JSON.stringify(selection)});status('subStatus','订阅选择已安全保存。','ok')}catch(e){status('subStatus','保存失败：'+e.message,'bad')}else status('subStatus','订阅选择已保存在当前浏览器。','ok')};
function parseM3U(s,base){const a=[];let p=null;for(const raw of s.split(/\r?\n/)){const l=raw.trim();if(!l)continue;if(/^#EXTINF/i.test(l)){const attrs={};for(const m of l.matchAll(/([\w-]+)="([^"]*)"/g))attrs[m[1]]=m[2];p={name:l.includes(',')?l.split(',',2)[1].trim():attrs['tvg-name']||'UNKNOWN',group:attrs['group-title']||'',logo:attrs['tvg-logo']||'',tvg_id:attrs['tvg-id']||''}}else if(!l.startsWith('#')){const z=l.split(',',2),u=norm(z.length>1?z[1]:z[0],base);if(u)a.push({name:p?.name||(z.length>1?z[0]:'UNKNOWN'),url:u,group_name:p?.group||'',logo:p?.logo||'',tvg_id:p?.tvg_id||''});p=null}}return a}
function parseJSONChannels(o,base){const a=[];function walk(x,g=''){if(Array.isArray(x)){x.forEach(y=>walk(y,g));return}if(!x||typeof x!=='object')return;const n=x.name||x.title||x.channel_name||x.channelName||'UNKNOWN',u=x.url||x.stream_url||x.streamUrl||x.play_url||x.playUrl||x.m3u8||x.source;if(typeof u==='string'&&u)a.push({name:String(n),url:norm(u,base),group_name:String(x.group||x.group_name||g||''),logo:x.logo||x['tvg-logo']||'',tvg_id:x.tvg_id||x.id||''});for(const k of ['channels','lives','items','data','list','streams','programs','results','rows'])if(k in x)walk(x[k],String(x.group||x.group_name||g||''))}walk(o);return a}
function parseXML(s,base){const doc=new DOMParser().parseFromString(s,'application/xml'),a=[];for(const e of [...doc.querySelectorAll('channel,item,stream')]){const n=e.getAttribute('name')||e.getAttribute('title')||e.getAttribute('id')||'UNKNOWN',u=e.getAttribute('url')||e.getAttribute('src')||e.querySelector('url,source,playurl')?.textContent||'';if(u)a.push({name:n,url:norm(u,base),group_name:e.getAttribute('group')||''})}return a}
function parseSource(text,type,base){const s=text.replace(/^﻿/,'').trim();if(/^#EXTM3U/i.test(s)||/#EXTINF/i.test(s.slice(0,12000))||/mpegurl/i.test(type))return parseM3U(s,base);if(/^[\[{]/.test(s)||/json/i.test(type)){try{return parseJSONChannels(JSON.parse(s),base)}catch{return []}}if(/^</.test(s))return parseXML(s,base);return parseM3U(s,base)}
function classify(r){const s=`${r.name||''} ${r.group_name||''} ${r.url||''}`.toLowerCase();if(/webview|网页|yangshipin|cctv\.com|live\.jstv|\.html(?:$|\?)/i.test(s))return '网页';if(/cctv|央视|cgtn|cctv\d|中央/i.test(s))return '央视';if(/凤凰|tvb|翡翠|港台|香港|澳门|台湾|hktv/i.test(s))return '港台';if(/卫视|湖南|浙江|江苏|东方|北京|广东|深圳|山东|安徽|湖北|四川|辽宁|河南|河北|江西|广西|黑龙江|吉林|天津|重庆|东南|厦门/i.test(s))return '卫视';return '其他'}
async function waitRemoteRun(afterMs,maxMs=180000){const started=afterMs||Date.now();const deadline=Date.now()+maxMs;while(Date.now()<deadline){const r=await api('/api/run?after='+encodeURIComponent(new Date(started).toISOString()));const run=r.run;if(run){if(run.status==='completed')return run;if(run.status==='failure'||run.status==='cancelled'||run.conclusion==='failure'||run.conclusion==='cancelled')throw Error('Actions 运行失败：'+(run.conclusion||run.status))}await new Promise(x=>setTimeout(x,2500))}throw Error('Actions 运行超过 3 分钟，请稍后刷新。')}
async function pullChannels(){const urls=selection.selected_subscription_urls||[];if(!urls.length){status('chStatus','请先选择订阅地址。','bad');return}const b=$('pullBtn');b.disabled=true;localPullErrors=[];try{if(remote){const started=Date.now();status('chStatus','正在提交全部直播源拉取任务…');await api('/api/selection',{method:'POST',body:JSON.stringify(selection)});await api('/api/pull',{method:'POST',body:JSON.stringify({})});status('chStatus','已提交 Actions，正在等待全部直播源生成…');await waitRemoteRun(started);await loadRemoteChannels();status('chStatus','已获取全部直播源，共 '+channels.length+' 条。','ok')}else{status('chStatus','本地模式：正在直接读取已选择的订阅…');const all=[];for(let i=0;i<urls.length;i++){const u=urls[i];try{status('chStatus',`本地模式：读取 ${i+1}/${urls.length} …`);const r=await getDirect(u);if(r.status<200||r.status>=300)throw Error('HTTP '+r.status);const rows=parseSource(r.text,r.type,r.url);for(const x of rows){x.category=x.category||classify(x);x.key=keyOf(x);all.push(x)}}catch(e){localPullErrors.push({url:u,error:String(e.message||e)})}}channels=dedupe(all,x=>x.url+'|'+x.name+'|'+x.group_name);for(const r of channels){r.category=r.category||classify(r);r.key=keyOf(r)}renderChannels();$('chCount').textContent='已选 '+channels.length+' / '+channels.length;if(localPullErrors.length){status('chStatus','本地模式已获取 '+channels.length+' 条；有 '+localPullErrors.length+' 个订阅无法被浏览器直接读取（通常是 CORS 限制）。','bad')}else status('chStatus','本地模式已获取全部直播源，共 '+channels.length+' 条。','ok')}}catch(e){status('chStatus','获取直播源失败：'+(e.message||e),'bad')}finally{b.disabled=false}}
function keyOf(r){return r.url+'|'+r.name+'|'+(r.category||'')}
async function loadRemoteChannels(){const r=await api('/api/channels');channels=(r.channels||[]).map(x=>({...x,key:x.channel_key||keyOf(x),category:x.category||classify(x)}));selection=r.selection||selection;renderChannels();$('chCount').textContent='共 '+channels.length+' 条'}
$('pullBtn').onclick=pullChannels;
function renderTabs(){const t=$('tabs');t.innerHTML=CATS.map(c=>`<div class="tab ${c===currentCat?'active':''}" data-cat="${c}">${c}</div>`).join('');t.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{currentCat=e.dataset.cat;renderTabs();renderChannels()})}
$('chSearch').oninput=renderChannels;
function renderChannels(){const q=$('chSearch').value.toLowerCase(),g={};for(const r of channels){if(currentCat!=='全部'&&r.category!==currentCat)continue;if(q&&!`${r.name} ${r.url} ${r.group_name} ${r.category}`.toLowerCase().includes(q))continue;(g[r.category||'其他']??=[]).push(r)}let html='';for(const k of CATS.slice(1)){if(!g[k]?.length)continue;html+=`<div class="group"><div class="group-title">${k} · ${g[k].length}</div>`+g[k].map(r=>{const on=selection.selected_channels?.[r.key]!==false;return `<label class="item"><div class="itemline"><input type="checkbox" data-key="${esc(r.key)}" ${on?'checked':''}><b>${esc(r.name)}</b>${r.group_name?`<span class="pill">${esc(r.group_name)}</span>`:''}</div><div class="url">${esc(r.url)}</div></label>`}).join('')+'</div>'}$('channels').innerHTML=html||'<div class="empty">暂无直播源，请先获取全部直播源</div>';document.querySelectorAll('#channels input').forEach(e=>e.onchange=()=>{selection.selected_channels[e.dataset.key]=e.checked;saveLocal();updateChCount()});updateChCount()}
function updateChCount(){const n=channels.filter(r=>selection.selected_channels?.[r.key]!==false).length;$('chCount').textContent='已选 '+n+' / '+channels.length}
$('chAll').onclick=()=>{selection.default_selected=true;selection.selected_channels={};for(const r of channels)selection.selected_channels[r.key]=true;saveLocal();renderChannels()};$('chNone').onclick=()=>{selection.default_selected=false;selection.selected_channels={};for(const r of channels)selection.selected_channels[r.key]=false;saveLocal();renderChannels()};$('chSave').onclick=async()=>{saveLocal();if(remote)try{await api('/api/selection',{method:'POST',body:JSON.stringify(selection)});status('chStatus','频道选择已安全保存。','ok')}catch(e){status('chStatus','保存失败：'+e.message,'bad')}else status('chStatus','频道选择已保存在当前浏览器。','ok')};
function chosenRows(){return channels.filter(r=>selection.selected_channels?.[r.key]!==false)}
function makeOutput(){let rows=chosenRows(),g=$('outGroup').value;if(g!=='all')rows=rows.filter(r=>r.category===g);let n=($('outName').value.trim()||'channels').replace(/[^\w\-一-鿿]+/g,'_'),f=$('outFormat').value,text='';if(f==='m3u'){const a=['#EXTM3U'];for(const r of rows)a.push(`#EXTINF:-1 tvg-id="${esc(r.tvg_id||'')}" tvg-logo="${esc(r.logo||'')}" group-title="${esc(r.category||'其他')}",${String(r.name||'UNKNOWN').replace(/[\r\n]/g,' ')}`,r.url||'');text=a.join('\n')+'\n'}else{text=rows.map(r=>`${String(r.name||'UNKNOWN').replace(/[\r\n]/g,' ')},${r.url||''}`).join('\n')+'\n'}const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));$('output').innerHTML=`<a href="${u}" download="${esc(n)}.${f}" style="color:#79b0ff">下载 ${esc(n)}.${f}</a> · 共 ${rows.length} 条`}
$('makeBtn').onclick=makeOutput;
async function loadRemoteState(){try{await api('/api/session');await loadRemoteChannels().catch(()=>{});status('subStatus','已连接管理服务。','ok')}catch(e){status('subStatus','管理服务会话已失效，请重新登录。','bad');clearLocalAuth();$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
(async function boot(){if(remote){if(await tryRemoteSession())return;$('login').classList.remove('hidden');$('app').classList.add('hidden');$('password').focus()}else{showApp()}})();
</script></body></html>
